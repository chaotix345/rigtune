name: update-rules

on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run the rules updater
        run: python tools/update_rules.py

      - name: Check for changes
        id: changes
        run: |
          set -eu
          for f in rules/rules-v2.json src/main/resources/rigtune/rules-v2.json rules/rules-v1.json rules/REVIEW.md; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the rules-update PR
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          date_stamp=$(date -u +%Y-%m-%d)
          branch="bot/rules-update-${date_stamp}"

          git checkout -B "$branch"
          git commit -m "chore(rules): weekly rules update ${date_stamp}"
          git push --force origin "$branch"

          # A push or PR made with the default GITHUB_TOKEN does not trigger other workflows'
          # `push`/`pull_request` events, but a workflow_dispatch always creates a run. Dispatch
          # build.yml before the PR step so CI runs on the branch either way.
          gh workflow run build.yml --ref "$branch"

          # The repo doesn't let GitHub Actions create pull requests (on purpose): then the
          # branch stays pushed and HQ opens the PR. Any other failure fails the job.
          existing_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --body-file rules/REVIEW.md
          elif ! out=$(gh pr create \
              --title "Rules update ${date_stamp}" \
              --body-file rules/REVIEW.md \
              --head "$branch" \
              --base main 2>&1); then
            echo "$out" >&2
            if echo "$out" | grep -q "not permitted to create or approve pull requests"; then
              echo "::notice::${branch} pushed; HQ opens the PR"
              echo "${branch} pushed; HQ opens the PR" >> "$GITHUB_STEP_SUMMARY"
            else
              exit 1
            fi
          else
            echo "$out"
          fi
