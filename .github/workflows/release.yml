name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # A job-level env var so `if:` conditions below can test it (an `if:` can't reference
      # `secrets.*` directly). Empty when the MODRINTH_TOKEN repo secret isn't set.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'

      # Built once. The GitHub release below and the Modrinth publish steps further down both
      # upload these exact files (Minotaur's uploadFile = jar reads the same `jar` task output
      # that ends up in versions/<mc>/build/libs), so they can't drift apart from being built
      # twice; "Verify Modrinth files match" re-downloads and hashes both sides anyway (M11).
      - name: Build
        run: ./gradlew build

      # Exactly one rigtune-<ver>+mc<mc>.jar and one -sources.jar per Minecraft version in versions/.
      - name: Create GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          files=()
          for dir in versions/*/; do
            mc=$(basename "$dir")
            for suffix in "" "-sources"; do
              mapfile -t found < <(find "${dir}build/libs" -maxdepth 1 -name "rigtune-*+mc${mc}${suffix}.jar" 2>/dev/null)
              if [ "${#found[@]}" -ne 1 ]; then
                echo "Expected exactly one rigtune-*+mc${mc}${suffix}.jar, found: ${found[*]:-none}"
                exit 1
              fi
              files+=("${found[0]}")
            done
          done
          gh release create "$tag" \
            --title "RigTune $tag" \
            --generate-notes \
            "${files[@]}"

      # --- Modrinth publishing ---
      # One Modrinth version per Minecraft version (build.gradle's `modrinth {}` block, versionType
      # alpha for a -snapshot-/-pre-/-rc- node), for every versions/*/ node, so a new node needs no
      # edit here. Each node is published on its own: a failure is recorded as an error and the
      # loop carries on with the others, and the step fails at the end if any node failed. A re-run
      # after a partial failure still publishes the one that's missing: Minotaur fails (not
      # duplicates) a version_number that already exists, so a node whose upload already succeeded
      # is a harmless no-op-turned-failure. `if: !cancelled()` (rather than the default
      # `if: success()`) lets the verify step below run even when this one failed.
      - name: Publish to Modrinth (every Minecraft version)
        if: ${{ !cancelled() && steps.release.outcome == 'success' && env.MODRINTH_TOKEN != '' }}
        run: |
          set -u
          status=0
          for dir in versions/*/; do
            mc=$(basename "$dir")
            if ./gradlew ":$mc:modrinth"; then
              echo "published: $mc"
            else
              echo "::error::Modrinth publish failed for $mc"
              status=1
            fi
          done
          exit "$status"

      - name: Notice if Modrinth publishing was skipped
        if: ${{ env.MODRINTH_TOKEN == '' }}
        run: echo "::notice::MODRINTH_TOKEN repo secret is not set; skipped publishing to Modrinth. GitHub release only."

      # M11: prove the file Modrinth is now serving is byte-identical to the one just attached to
      # the GitHub release, rather than assuming it because they came from the same build. Looks
      # up each re-downloaded GitHub asset by its own sha1 (GET /v2/version_file/{sha1}, verified
      # live against docs.modrinth.com during WS-F) and compares the returned file's sha512.
      - name: Verify Modrinth files match the GitHub release
        if: ${{ !cancelled() && steps.release.outcome == 'success' && env.MODRINTH_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          scratch=$(mktemp -d)
          status=0
          for dir in versions/*/; do
            mc=$(basename "$dir")
            mapfile -t found < <(find "${dir}build/libs" -maxdepth 1 -name "rigtune-*+mc${mc}.jar" 2>/dev/null)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected exactly one rigtune-*+mc${mc}.jar locally, found: ${found[*]:-none}"
              status=1
              continue
            fi
            asset=$(basename "${found[0]}")
            if ! gh release download "$tag" --repo "${GITHUB_REPOSITORY}" -p "$asset" -D "$scratch" --clobber; then
              echo "::error::could not download GitHub release asset $asset to verify"
              status=1
              continue
            fi
            sha1_local=$(sha1sum "$scratch/$asset" | cut -d' ' -f1)
            sha512_local=$(sha512sum "$scratch/$asset" | cut -d' ' -f1)
            # The project's version list, fetched with the token: the public hash lookup
            # (/v2/version_file) hides versions of a project that's still in moderation.
            versions_json="$scratch/versions.json"
            if [ ! -s "$versions_json" ] && ! curl -sf \
                -H "User-Agent: chaotix345/rigtune/release (github.com/chaotix345/rigtune)" \
                -H "Authorization: ${MODRINTH_TOKEN}" \
                "https://api.modrinth.com/v2/project/rigtune/version" -o "$versions_json"; then
              echo "::error::could not list the Modrinth project's versions"
              status=1
              continue
            fi
            sha512_remote=$(jq -r --arg s "$sha1_local" '[.[].files[] | select(.hashes.sha1 == $s) | .hashes.sha512][0] // empty' "$versions_json")
            if [ -z "$sha512_remote" ]; then
              echo "::error::no Modrinth version file matches $asset's sha1 ($sha1_local): upload missing or corrupted"
              status=1
              continue
            fi
            if [ "$sha512_local" != "$sha512_remote" ]; then
              echo "::error::sha512 mismatch for $asset: GitHub=$sha512_local Modrinth=$sha512_remote"
              status=1
              continue
            fi
            echo "verified: $asset sha512 matches its Modrinth upload"
          done
          exit "$status"
