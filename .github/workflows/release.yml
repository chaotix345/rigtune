name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Only whether the secret is set ('true'/'false'), so `if:` conditions below can test it (an
      # `if:` can't reference `secrets.*` directly). The token itself is set only on the two steps
      # that use it, so the build (Gradle, its plugins, dependencies and tests) never sees it
      # (review 6, security-1).
      MODRINTH_TOKEN_SET: ${{ secrets.MODRINTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      # The tag names the release: it must be v<mod_version> exactly (a v0.3.0 tag on a commit that
      # still says 0.3.0-dev would publish 0.3.0-dev+mc<mc> as a release).
      - name: Check the tag matches mod_version
        run: |
          grep -qxF "mod_version=${GITHUB_REF_NAME#v}" gradle.properties \
            || { echo "::error::tag ${GITHUB_REF_NAME} doesn't match mod_version in gradle.properties"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'

      # Built once. The release step copies the jars out of the build (to $RUNNER_TEMP/release-files),
      # and both the GitHub release and the Modrinth publish upload those copies, so the two carry
      # the same bytes by construction even if a later Gradle task touched versions/<mc>/build/libs
      # (Minotaur's `modrinth` depends on `assemble`); "Verify Modrinth files match" re-downloads and
      # hashes both sides anyway (M11).
      - name: Build
        run: ./gradlew build

      # Exactly one rigtune-<ver>+mc<mc>.jar and one -sources.jar per Minecraft version in versions/.
      - name: Create GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          staged="$RUNNER_TEMP/release-files"
          mkdir -p "$staged"
          files=()
          for dir in versions/*/; do
            mc=$(basename "$dir")
            for suffix in "" "-sources"; do
              mapfile -t found < <(find "${dir}build/libs" -maxdepth 1 -name "rigtune-*+mc${mc}${suffix}.jar" 2>/dev/null)
              if [ "${#found[@]}" -ne 1 ]; then
                echo "Expected exactly one rigtune-*+mc${mc}${suffix}.jar, found: ${found[*]:-none}"
                exit 1
              fi
              cp "${found[0]}" "$staged/"
              files+=("$staged/$(basename "${found[0]}")")
            done
          done
          gh release create "$tag" \
            --title "RigTune $tag" \
            --generate-notes \
            "${files[@]}"

      # --- Modrinth publishing ---
      # One Modrinth version per Minecraft version (build.gradle's `modrinth {}` block; versionType
      # release only for a plain release id), for every versions/*/ node, so a new node needs no
      # edit here. Each node uploads the exact file the release step attached (its copy in
      # $RUNNER_TEMP/release-files, passed as -PmodrinthFile). A failure is recorded as an error and
      # the loop carries on with the others; the step fails at the end if any node failed.
      # `if: !cancelled()` (rather than the default `if: success()`) lets the verify step below run
      # even when this one failed.
      #
      # Recovery when a node's publish failed. Don't re-run the job: "Create GitHub release" fails
      # because the release exists, and everything after it is skipped. Never rebuild either: upload
      # the file the GitHub release already has. From a checkout of the tag, per failed node (Git
      # Bash; the token comes from MODRINTH_TOKEN in the user environment; the tool refuses a sha256
      # mismatch and does nothing if the version_number already exists; --dry-run shows the payload):
      #   tag=v0.3.0 mc=26.3; ver=${tag#v}; jar="rigtune-$ver+mc$mc.jar"
      #   gh release download "$tag" -p "$jar" -D recovery
      #   digest=$(gh release view "$tag" --json assets -q ".assets[] | select(.name == \"$jar\") | .digest")
      #   awk -v h="[$ver]" '/^## /{p = index($0, h) > 0; next} p' CHANGELOG.md > recovery/changelog.md
      #   python tools/modrinth_project.py upload-version --file "recovery/$jar" \
      #     --version-number "$ver+mc$mc" --name "RigTune $ver (MC $mc)" --game-versions "$mc" \
      #     --version-type release --changelog-file recovery/changelog.md --sha256 "${digest#sha256:}"
      # (--version-type alpha for a node whose id isn't a plain release.) Then check it the way the
      # verify step does: `python tools/modrinth_project.py status` lists the version, and in the
      # authenticated version list (GET /v2/project/rigtune/version) the file with the GitHub
      # asset's sha1 must have the asset's sha512.
      - name: Publish to Modrinth (every Minecraft version)
        if: ${{ !cancelled() && steps.release.outcome == 'success' && env.MODRINTH_TOKEN_SET == 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -u
          staged="$RUNNER_TEMP/release-files"
          status=0
          for dir in versions/*/; do
            mc=$(basename "$dir")
            mapfile -t found < <(find "$staged" -maxdepth 1 -name "rigtune-*+mc${mc}.jar" 2>/dev/null)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected exactly one rigtune-*+mc${mc}.jar to publish, found: ${found[*]:-none}"
              status=1
              continue
            fi
            if ./gradlew ":$mc:modrinth" "-PmodrinthFile=${found[0]}"; then
              echo "published: $mc (${found[0]})"
            else
              echo "::error::Modrinth publish failed for $mc"
              status=1
            fi
          done
          exit "$status"

      - name: Notice if Modrinth publishing was skipped
        if: ${{ env.MODRINTH_TOKEN_SET != 'true' }}
        run: echo "::notice::MODRINTH_TOKEN repo secret is not set; skipped publishing to Modrinth. GitHub release only."

      # M11: prove the file Modrinth is now serving is byte-identical to the one just attached to
      # the GitHub release, rather than assuming it because they came from the same build. Finds
      # each re-downloaded GitHub asset's sha1 in the project's authenticated version list (the
      # public /v2/version_file lookup hides versions of a project in moderation) and compares
      # that file's sha512.
      - name: Verify Modrinth files match the GitHub release
        if: ${{ !cancelled() && steps.release.outcome == 'success' && env.MODRINTH_TOKEN_SET == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          scratch=$(mktemp -d)
          status=0
          for dir in versions/*/; do
            mc=$(basename "$dir")
            mapfile -t found < <(find "${dir}build/libs" -maxdepth 1 -name "rigtune-*+mc${mc}.jar" 2>/dev/null)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected exactly one rigtune-*+mc${mc}.jar locally, found: ${found[*]:-none}"
              status=1
              continue
            fi
            asset=$(basename "${found[0]}")
            if ! gh release download "$tag" --repo "${GITHUB_REPOSITORY}" -p "$asset" -D "$scratch" --clobber; then
              echo "::error::could not download GitHub release asset $asset to verify"
              status=1
              continue
            fi
            sha1_local=$(sha1sum "$scratch/$asset" | cut -d' ' -f1)
            sha512_local=$(sha512sum "$scratch/$asset" | cut -d' ' -f1)
            # The project's version list, fetched with the token: the public hash lookup
            # (/v2/version_file) hides versions of a project that's still in moderation.
            versions_json="$scratch/versions.json"
            if [ ! -s "$versions_json" ] && ! curl -sf \
                -H "User-Agent: chaotix345/rigtune/release (github.com/chaotix345/rigtune)" \
                -H "Authorization: ${MODRINTH_TOKEN}" \
                "https://api.modrinth.com/v2/project/rigtune/version" -o "$versions_json"; then
              echo "::error::could not list the Modrinth project's versions"
              status=1
              continue
            fi
            sha512_remote=$(jq -r --arg s "$sha1_local" '[.[].files[] | select(.hashes.sha1 == $s) | .hashes.sha512][0] // empty' "$versions_json")
            if [ -z "$sha512_remote" ]; then
              echo "::error::no Modrinth version file matches $asset's sha1 ($sha1_local): upload missing or corrupted"
              status=1
              continue
            fi
            if [ "$sha512_local" != "$sha512_remote" ]; then
              echo "::error::sha512 mismatch for $asset: GitHub=$sha512_local Modrinth=$sha512_remote"
              status=1
              continue
            fi
            echo "verified: $asset sha512 matches its Modrinth upload"
          done
          exit "$status"
