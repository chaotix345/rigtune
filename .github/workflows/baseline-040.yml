name: baseline-040

# SCRATCH (scratch/baseline-040, never merged): the coordinator's baseline for the returning-player gate: RigTune 0.4.0's
# startup footprint with the same returning-player seed, against this build, on the same runner.
on:
  push:
    branches: [scratch/baseline-040]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25.0.3'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Fetch 0.4.0 and build (network)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p build/baseline
          gh release download v0.4.0 -R "$GITHUB_REPOSITORY" -p "rigtune-0.4.0+mc26.2.jar" -D build/baseline --clobber
          echo "801cd3b8e91c6a27b819d64c5b433bea6d7ac99d4776cb853c873a9cafdd868a  build/baseline/rigtune-0.4.0+mc26.2.jar" | sha256sum -c -
          ./gradlew --no-daemon :26.2:jar :26.2:downloadAssets :26.2:prefetchDependencies :26.2:e2eDriverJar "-Pe2e.oldJar=$PWD/build/baseline/rigtune-0.4.0+mc26.2.jar"
      - name: Runner
        run: |
          echo "image $ImageOS $ImageVersion; $(lscpu | sed -n 's/^Model name: *//p'); $(nproc) CPUs"
      - name: Startup, 0.4.0 and this build, fresh and returning
        timeout-minutes: 25
        run: bash tools/ci/baseline040.sh 26.2
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-040
          path: |
            build/baseline/summary.txt
            build/baseline/*.gradle.log
            build/baseline/*/logs/latest.log
          if-no-files-found: ignore
