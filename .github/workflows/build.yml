name: build

on:
  push:
  pull_request:
  # Allows the update-rules workflow to trigger a build for the PR it opens: a PR opened with the
  # default GITHUB_TOKEN does not fire other workflows' `pull_request`/`push` events, so
  # update-rules.yml calls `gh workflow run build.yml` explicitly. See the comment there.
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      # Stonecutter rewrites src/ when the active Minecraft version is switched. Commits must be in the state
      # of the VCS version, 26.2 (settings.gradle vcsVersion, stonecutter.gradle active), with canonical comments.
      - name: Check sources are in the committed 26.2 state
        env:
          VCS_MC: '26.2'
        run: |
          set -eu
          grep -qF "vcsVersion = '$VCS_MC'" settings.gradle || { echo "settings.gradle: vcsVersion must be '$VCS_MC'"; exit 1; }
          grep -qxF "stonecutter.active '$VCS_MC'" stonecutter.gradle || { echo "stonecutter.gradle: active version must be '$VCS_MC'; run ./gradlew \"Reset active project\" and commit"; exit 1; }
          ./gradlew "Reset active project"
          git diff --exit-code || { echo "Sources are in a switched state; run ./gradlew \"Reset active project\" and commit"; exit 1; }
      # Builds and unit-tests every Minecraft version (versions/<mc>/); check also compiles each version's game tests.
      - name: Build and test
        run: ./gradlew build
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rigtune-jars
          path: versions/*/build/libs/*.jar
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            versions/*/build/reports/tests/**
            versions/*/build/test-results/**
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run rules updater tests
        run: python -m unittest discover -s tools/tests -v
      - name: Run self-update E2E harness tests
        run: python -m unittest discover -s tools/e2e/tests -v

  rules-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare generated rules files
        run: |
          set -eu
          # 0.2 bundles only rules-v2.json; rules/rules-v1.json is served to 0.1.x clients and never bundled.
          cmp rules/rules-v2.json src/main/resources/rigtune/rules-v2.json
          if [ -e src/main/resources/rigtune/rules-v1.json ]; then
            echo "src/main/resources/rigtune/rules-v1.json must not exist: 0.2 bundles rules-v2.json only."
            exit 1
          fi

  # rules-v1.json is what 0.1.x clients download: it must stay the safe v1 projection of the v2 rules.
  rules-v1-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check rules-v1.json
        run: python tools/check_rules_v1.py
