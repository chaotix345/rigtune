name: build

on:
  push:
  pull_request:
  # Allows the update-rules workflow to trigger a build for the PR it opens: a PR opened with the
  # default GITHUB_TOKEN does not fire other workflows' `pull_request`/`push` events, so
  # update-rules.yml calls `gh workflow run build.yml` explicitly. See the comment there.
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - name: Build and test
        run: ./gradlew build
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rigtune-jars
          path: build/libs/*.jar
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run rules updater tests
        run: python -m unittest discover -s tools/tests -v

  rules-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare generated rules files
        run: |
          set -eu
          a=rules/rules-v1.json
          b=src/main/resources/rigtune/rules-v1.json
          if [ ! -f "$a" ] && [ ! -f "$b" ]; then
            echo "Neither $a nor $b exists yet (rules updater hasn't run); nothing to compare."
            exit 0
          fi
          if [ ! -f "$a" ] || [ ! -f "$b" ]; then
            echo "Only one of $a / $b exists; they must be generated together."
            exit 1
          fi
          cmp "$a" "$b"
