# Research experiment (docs/research/v0.5/verification-gaps.md, r-verify): the self-update E2E on Linux CI under Xvfb,
# and the probes behind the battery and LAN-guest test designs. Runs only on the research branch.
name: r-verify-experiment

on:
  push:
    branches: [research/v05-verify]

permissions:
  contents: read

jobs:
  e2e-linux:
    name: e2e ${{ matrix.name }} (${{ matrix.mc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.2', name: linux-downgrade-dev-to-030, tag: v0.3.0, old: 'rigtune-0.3.0+mc26.2.jar', args: '--scenario downgrade', battery: '' }
          - { mc: '26.2', name: linux-v040-to-dev-fake-battery, tag: v0.4.0, old: 'rigtune-0.4.0+mc26.2.jar', args: '--expect-history auto --jvm-arg=-Doshi.os.linux.allowudev=false', battery: 'Discharging' }
    env:
      SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: skip
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the new jar
        run: |
          set -eu
          ./gradlew ":${{ matrix.mc }}:jar"
          mkdir -p "$RUNNER_TEMP/jars"
          cp versions/${{ matrix.mc }}/build/libs/rigtune-*+mc${{ matrix.mc }}.jar "$RUNNER_TEMP/jars/"
          ls -l "$RUNNER_TEMP/jars"
      - name: Download the released old jar
        if: matrix.old != ''
        run: gh release download "${{ matrix.tag }}" -R "$GITHUB_REPOSITORY" -p '${{ matrix.old }}' -D "$RUNNER_TEMP/jars" --clobber
      - name: A fake battery in /sys/class/power_supply (tmpfs; OSHI reads it with udev off)
        if: matrix.battery != ''
        run: |
          sudo mount -t tmpfs -o mode=0777 tmpfs /sys/class/power_supply
          mkdir -p /sys/class/power_supply/BAT0
          printf 'POWER_SUPPLY_NAME=BAT0\nPOWER_SUPPLY_TYPE=Battery\nPOWER_SUPPLY_STATUS=${{ matrix.battery }}\nPOWER_SUPPLY_PRESENT=1\nPOWER_SUPPLY_TECHNOLOGY=Li-ion\nPOWER_SUPPLY_CHARGE_FULL_DESIGN=5000000\nPOWER_SUPPLY_CHARGE_FULL=4000000\nPOWER_SUPPLY_CHARGE_NOW=2000000\nPOWER_SUPPLY_CAPACITY=50\nPOWER_SUPPLY_MODEL_NAME=RigTune fake battery\n' > /sys/class/power_supply/BAT0/uevent
          cat /sys/class/power_supply/BAT0/uevent
      - name: Let the fake Modrinth bind 443
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Run the E2E scenario
        run: |
          set -u
          new=$(ls "$RUNNER_TEMP"/jars/rigtune-*-dev+mc${{ matrix.mc }}.jar)
          old_args=()
          if [ -n "${{ matrix.old }}" ]; then
            old_args=(--old-jar "$RUNNER_TEMP/jars/${{ matrix.old }}")
          fi
          start=$(date +%s)
          python3 tools/e2e/self_update_e2e.py --lock none --mc "${{ matrix.mc }}" --name "${{ matrix.name }}" \
            "${old_args[@]}" --new-jar "$new" --work "$RUNNER_TEMP/e2e" \
            --evidence "$RUNNER_TEMP/evidence/${{ matrix.name }}-${{ matrix.mc }}" ${{ matrix.args }}
          rc=$?
          echo "wall seconds: $(( $(date +%s) - start )), exit $rc"
          exit $rc
      - name: What the game's startup probe saw (Hardware line)
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/e2e/*/instance*/logs/latest.log; do grep -a -o 'hasBattery=[a-z]*, onBattery=[a-z]*' "$f" || true; grep -a 'RigTune power\|battery' "$f" | head -5 || true; done
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.name }}-${{ matrix.mc }}
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/e2e/*/e2e.log
            ${{ runner.temp }}/e2e/*/gradle-*.log
            ${{ runner.temp }}/e2e/*/instance*/logs/
            ${{ runner.temp }}/e2e/*/instance*/crash-reports/
          if-no-files-found: ignore
