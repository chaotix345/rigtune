plugins {
	id 'net.fabricmc.fabric-loom'
	id 'com.modrinth.minotaur' version '2.10.0'
}

// This script runs once per Minecraft version (versions/<mc>/), with that version's gradle.properties.
def mcVersion = stonecutter.current.version
version = "${project.mod_version}+mc${mcVersion}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rigtune" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "rigtune-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mcVersion}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Optional: a new Minecraft version can build and run its unit tests before Sodium supports it.
	if (project.findProperty("sodium_version")) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// Development only: a plain client (no game-test harness) that runs the benchmark-world flow by itself and quits
// (client/benchmark/DevAutorun). ./gradlew :<mc>:runBenchmarkAutorun [-PrigtuneAutorun=benchmark-world-cancel]
loom {
	runs {
		benchmarkAutorun {
			client()
			configName = "Benchmark autorun"
			runDir = "build/run-autorun"
			vmArg "-Drigtune.dev.autorun=${project.findProperty('rigtuneAutorun') ?: 'benchmark-world'}"
			ideConfigGenerated = false
		}
	}
}

// DevAutorun only starts from the title screen, and a fresh run dir would stop at the accessibility onboarding screen.
tasks.matching { it.name == "runBenchmarkAutorun" }.configureEach {
	def options = file("build/run-autorun/options.txt")
	doFirst {
		options.parentFile.mkdirs()
		def lines = options.exists() ? options.readLines("UTF-8").findAll { !it.startsWith("onboardAccessibility:") } : []
		options.setText((lines + "onboardAccessibility:false").join("\n") + "\n", "UTF-8")
	}
}

// Distant Horizons and Iris are optional at runtime: only client/compat/DhCompat and IrisCompat use their APIs, and
// only after FabricLoader says the mod is loaded (the benchmark's cost reports).
dependencies {
	compileOnly "maven.modrinth:distanthorizonsapi:${project.dh_api_version}"
	compileOnly("maven.modrinth:iris:${project.iris_version}") {
		transitive = false
	}
}

sourceSets {
	test {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

test {
	useJUnitPlatform()
	workingDir = layout.buildDirectory.dir("junit-run").get().asFile
	doFirst { workingDir.mkdirs() }
}

// The game tests only run on demand (runClientGameTest), but every version's must at least compile.
tasks.named("check") {
	dependsOn tasks.named("gametestClasses")
}

processResources {
	def props = ["version": project.version, "minecraft_dependency": project.minecraft_dependency]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

// --- Modrinth publishing (SPEC.md item 4) ---
// One Modrinth version per Minecraft version: `./gradlew :<mc>:modrinth` runs this directly;
// release.yml runs it for every versions/*/ node in a loop, after building; one node's failure doesn't stop the others.
// `uploadFile = jar` (not remapJar: 26.x is unobfuscated, there is no remapJar task).
// Verify locally without a token via `./gradlew :26.2:modrinth -PmodrinthDryRun`.
def changelogForVersion(String modVersion) {
	def file = rootProject.file('CHANGELOG.md')
	if (!file.exists()) return ''
	def lines = file.readLines()
	// Accept the exact mod_version heading, or its release form with any "-dev"/pre-release
	// suffix stripped, so a "0.2.0-dev" dev build still finds a "## [0.2.0]" section.
	def candidates = [modVersion, modVersion.replaceAll(/-.*/, '')].unique()
	def start = lines.findIndexOf { line -> line.startsWith('## ') && candidates.any { line.contains("[$it]") } }
	if (start < 0) return ''
	def end = lines.size()
	for (int i = start + 1; i < lines.size(); i++) {
		if (lines[i].startsWith('## ')) {
			end = i
			break
		}
	}
	return lines.subList(start + 1, end).join('\n').trim()
}

// -PmodrinthDryRun (any value, or none) verifies the config/payload without a token or a real
// upload: debugMode makes Minotaur log what it would send instead of calling the API, but it
// still requires *a* token value, so a placeholder is used when MODRINTH_TOKEN isn't set. CI
// only ever sets MODRINTH_TOKEN (and never this property), for a real, non-debug publish.
def modrinthDryRun = providers.gradleProperty('modrinthDryRun').present
def modrinthToken = System.getenv('MODRINTH_TOKEN') ?: (modrinthDryRun ? 'dry-run-placeholder-token' : null)
// -PmodrinthFile=<path>: upload that exact file instead of this build's jar output. release.yml passes its copy of the file
// it attached to the GitHub release, so both carry the same bytes by construction.
def modrinthFile = providers.gradleProperty('modrinthFile')

modrinth {
	token = modrinthToken
	projectId = 'rigtune'
	versionNumber = project.version.toString()
	versionName = "RigTune ${project.mod_version} (MC ${mcVersion})"
	// Only a plain release id (26.3, 26.3.1) publishes as a release; anything else (snapshot, pre, rc) as an alpha.
	versionType = mcVersion ==~ /\d+\.\d+(\.\d+)?/ ? 'release' : 'alpha'
	uploadFile = modrinthFile.present ? rootProject.file(modrinthFile.get()) : jar
	gameVersions = [mcVersion]
	loaders = ['fabric']
	changelog = changelogForVersion(project.mod_version.toString())
	debugMode = modrinthDryRun
	dependencies {
		required.project 'fabric-api'
	}
}

// A production client with a player's own mods, driven by the client game test in smoke mode (see ProductionSmoke):
// ./gradlew :<mc>:runProductionSmoke -PextraModsDir=<dir of mod jars> [-PuserOptions=<options.txt>] [-PuserConfigDir=<config dir>]
// The paths are relative to the repository root. The jars (built for that <mc>) are mirrored into versions/<mc>/run/mods,
// where RigTune treats them as the instance's own mods, as in a launcher instance.
configurations {
	productionSmokeMods {
		canBeConsumed = false
		transitive = false
	}
}

dependencies {
	// The fabric-api fat jar doesn't nest the client game test module.
	productionSmokeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
}

def gametestJar = tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	archiveClassifier = "gametest"
}

interface InjectedFs {
	@javax.inject.Inject
	FileSystemOperations getFs()
}

def smokeRunDir = layout.projectDirectory.dir("run")
def extraModsDir = providers.gradleProperty("extraModsDir").map { rootProject.layout.projectDirectory.dir(it).asFile }
def userOptions = providers.gradleProperty("userOptions").map { rootProject.layout.projectDirectory.file(it).asFile }
def userConfigDir = providers.gradleProperty("userConfigDir").map { rootProject.layout.projectDirectory.dir(it).asFile }

def prepareProductionSmoke = tasks.register("prepareProductionSmoke") {
	def fs = objects.newInstance(InjectedFs).fs
	outputs.upToDateWhen { false }
	doLast {
		if (!extraModsDir.present) {
			throw new GradleException("Pass -PextraModsDir=<dir>: it has to provide fabric-api and the player's mods")
		}
		fs.sync {
			from(extraModsDir.get()) { include "*.jar" }
			into smokeRunDir.dir("mods")
		}
		if (userOptions.present) {
			// Exclusive fullscreen would take over the monitor, and the game test framebuffer has a fixed size anyway.
			fs.copy {
				from(userOptions.get()) { rename { "options.txt" } }
				into smokeRunDir
				filter { String line -> line.startsWith("fullscreen:") ? "fullscreen:false" : line }
			}
		}
		if (userConfigDir.present) {
			fs.copy {
				from userConfigDir.get()
				into smokeRunDir.dir("config")
			}
		}
	}
}

tasks.register("runProductionSmoke", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn prepareProductionSmoke
	runDir = smokeRunDir
	mods.from(gametestJar)
	mods.from(configurations.productionSmokeMods)
	jvmArgs.addAll("-Dfabric.client.gametest", "-Drigtune.smoke=true")
	jvmArgs.addAll(userOptions.map { ["-Drigtune.smoke.userOptions=" + it.absolutePath] }.orElse([]))
	// -PsmokeBenchmark: also run a short benchmark in the smoke world and check the DH/Iris restore (BenchmarkSmoke).
	jvmArgs.addAll(providers.gradleProperty("smokeBenchmark").map { ["-Drigtune.smoke.benchmark=true"] }.orElse([]))
	// -PsmokeDh=stage|check: AC7.3 from the title screen only, no world (DhConfigSmoke).
	jvmArgs.addAll(providers.gradleProperty("smokeDh").map { ["-Drigtune.smoke.dh=" + it] }.orElse([]))
}

// CI (build.yml, client-gametest): the client game tests against the built jar in a production client, with
// fabric-api, Sodium and ModMenu as real mod jars (the dev run has them on localRuntime). Its own run dir, wiped first.
configurations {
	productionGameTestMods {
		canBeConsumed = false
		transitive = false
	}
}

dependencies {
	productionGameTestMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionGameTestMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
	productionGameTestMods "com.terraformersmc:modmenu:${project.modmenu_version}"
	if (project.findProperty("sodium_version")) {
		productionGameTestMods "maven.modrinth:sodium:${project.sodium_version}"
	}
}

def productionGameTestRunDir = layout.buildDirectory.dir("run/productionClientGameTest")

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	def fs = objects.newInstance(InjectedFs).fs
	runDir = productionGameTestRunDir
	mods.from(gametestJar)
	mods.from(configurations.productionGameTestMods)
	jvmArgs.add("-Dfabric.client.gametest")
	doFirst {
		fs.delete { delete productionGameTestRunDir }
	}
}

// v0.4 (docs/v0.4/SPEC.md 6, AC6.6): extra JVM arguments for a LOCAL game-test run, split on whitespace, e.g.
// ./gradlew :26.2:runProductionClientGameTest -PgametestJvmArgs="-XX:+UseZGC -XX:+ZGenerational -Dusing.aikars.flags=x"
// (JvmGameTest then checks that the notes come from the running JVM). CI never passes it.
def gametestJvmArgs = providers.gradleProperty("gametestJvmArgs").map { it.trim().split(/\s+/).findAll { !it.isEmpty() } }.orElse([])
tasks.named("runProductionClientGameTest") {
	jvmArgs.addAll(gametestJvmArgs)
}
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	jvmArgumentProviders.add({ gametestJvmArgs.get() } as CommandLineArgumentProvider)
}

// Self-update end-to-end harness (tools/e2e/README.md), never part of the shipped jar or of `build`. The fake Modrinth
// server is a JDK-only tool run as `java FakeModrinth.java`; the unit tests compile it from tools/e2e/java.
sourceSets.test.java.srcDir(rootProject.file("tools/e2e/java"))

// The driver mod (src/e2e) compiles against the released v0.1.0 jar (-Pe2e.oldJar=<path>), not these sources, so it
// only uses API that 0.1.0 has.
def e2eOldJar = providers.gradleProperty("e2e.oldJar")
sourceSets {
	e2e {
		// Empty without the property, so an IDE sync still resolves every source set; compiling then fails below.
		compileClasspath += sourceSets.client.compileClasspath - sourceSets.main.output + files({
			e2eOldJar.present ? rootProject.file(e2eOldJar.get()) : []
		})
	}
}

tasks.named("compileE2eJava") {
	doFirst {
		if (!e2eOldJar.present) {
			throw new GradleException("Pass -Pe2e.oldJar=<path to the released rigtune-0.1.0.jar>")
		}
	}
}

def e2eDriverJar = tasks.register("e2eDriverJar", Jar) {
	from sourceSets.e2e.output
	archiveBaseName = "rigtune-e2e-driver"
	archiveVersion = ""
}

// The undo driver (src/e2eUndo, plan review M14) uses 0.2's API, so it compiles against these sources.
sourceSets {
	e2eUndo {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
	}
}

def e2eUndoDriverJar = tasks.register("e2eUndoDriverJar", Jar) {
	from sourceSets.e2eUndo.output
	archiveBaseName = "rigtune-e2e-undo-driver"
	archiveVersion = ""
}

// The downgrade driver (src/e2eDowngrade, v0.4 SPEC AC3.2) drives the released 0.3.0 jar on files 0.4 wrote, so like the
// self-update driver it compiles against the released jar (-Pe2e.oldJar), never these sources.
sourceSets {
	e2eDowngrade {
		compileClasspath += sourceSets.client.compileClasspath - sourceSets.main.output + files({
			e2eOldJar.present ? rootProject.file(e2eOldJar.get()) : []
		})
	}
}

tasks.named("compileE2eDowngradeJava") {
	doFirst {
		if (!e2eOldJar.present) {
			throw new GradleException("Pass -Pe2e.oldJar=<path to the released rigtune-0.3.0+mc26.2.jar>")
		}
	}
}

def e2eDowngradeDriverJar = tasks.register("e2eDowngradeDriverJar", Jar) {
	from sourceSets.e2eDowngrade.output
	archiveBaseName = "rigtune-e2e-downgrade-driver"
	archiveVersion = ""
}

// One launch of a production client on a scratch instance (-Pe2e.instance=<dir>), with JVM arguments from
// -Pe2e.jvmArgsFile (one per line). Unlike runProductionSmoke, `mods` is only the driver: Loom would otherwise add this
// project's jar through -Dfabric.addMods, and RigTune must load only from the instance's mods folder (plan review M10).
tasks.register("e2eClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	def instance = providers.gradleProperty("e2e.instance")
	def jvmArgsFile = providers.gradleProperty("e2e.jvmArgsFile")
	runDir = layout.dir(instance.map { new File(it) })
	// -Pe2e.driver=undo or =downgrade picks that driver; the default is the self-update driver.
	def driver = providers.gradleProperty("e2e.driver").getOrElse("")
	mods.setFrom(driver == "undo" ? e2eUndoDriverJar : driver == "downgrade" ? e2eDowngradeDriverJar : e2eDriverJar)
	jvmArgs.addAll(jvmArgsFile.map { new File(it).readLines("UTF-8").findAll { !it.isBlank() } }.orElse([]))
	programArgs.addAll("--width", "1280", "--height", "720")
	doFirst {
		if (!instance.present) {
			throw new GradleException("Pass -Pe2e.instance=<scratch instance dir>; see tools/e2e/README.md")
		}
	}
}
