plugins {
	id 'net.fabricmc.fabric-loom'
	id 'com.modrinth.minotaur' version '2.10.0'
}

// This script runs once per Minecraft version (versions/<mc>/), with that version's gradle.properties.
def mcVersion = stonecutter.current.version
version = "${project.mod_version}+mc${mcVersion}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rigtune" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "rigtune-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mcVersion}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Optional: a new Minecraft version can build and run its unit tests before Sodium supports it.
	if (project.findProperty("sodium_version")) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// Development only: a plain client (no game-test harness) that runs the benchmark-world flow by itself and quits
// (client/benchmark/DevAutorun). ./gradlew :<mc>:runBenchmarkAutorun [-PrigtuneAutorun=benchmark-world-cancel]
loom {
	runs {
		benchmarkAutorun {
			client()
			configName = "Benchmark autorun"
			runDir = "build/run-autorun"
			vmArg "-Drigtune.dev.autorun=${project.findProperty('rigtuneAutorun') ?: 'benchmark-world'}"
			ideConfigGenerated = false
		}
	}
}

// DevAutorun only starts from the title screen, and a fresh run dir would stop at the accessibility onboarding screen.
tasks.matching { it.name == "runBenchmarkAutorun" }.configureEach {
	def options = file("build/run-autorun/options.txt")
	doFirst {
		options.parentFile.mkdirs()
		def lines = options.exists() ? options.readLines("UTF-8").findAll { !it.startsWith("onboardAccessibility:") } : []
		options.setText((lines + "onboardAccessibility:false").join("\n") + "\n", "UTF-8")
	}
}

// Distant Horizons and Iris are optional at runtime: only client/compat/DhCompat and IrisCompat use their APIs, and
// only after FabricLoader says the mod is loaded (the benchmark's cost reports).
dependencies {
	compileOnly "maven.modrinth:distanthorizonsapi:${project.dh_api_version}"
	compileOnly("maven.modrinth:iris:${project.iris_version}") {
		transitive = false
	}
}

sourceSets {
	test {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

test {
	useJUnitPlatform()
	workingDir = layout.buildDirectory.dir("junit-run").get().asFile
	doFirst { workingDir.mkdirs() }
}

// The game tests only run on demand (runClientGameTest), but every version's must at least compile.
tasks.named("check") {
	dependsOn tasks.named("gametestClasses")
}

processResources {
	def props = ["version": project.version, "minecraft_dependency": project.minecraft_dependency]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

// --- Modrinth publishing (SPEC.md item 4) ---
// One Modrinth version per Minecraft version: `./gradlew :<mc>:modrinth` runs this directly;
// release.yml runs it for every versions/*/ node in a loop, after building; one node's failure doesn't stop the others.
// `uploadFile = jar` (not remapJar: 26.x is unobfuscated, there is no remapJar task).
// Verify locally without a token via `./gradlew :26.2:modrinth -PmodrinthDryRun`.
def changelogForVersion(String modVersion) {
	def file = rootProject.file('CHANGELOG.md')
	if (!file.exists()) return ''
	def lines = file.readLines()
	// Accept the exact mod_version heading, or its release form with any "-dev"/pre-release
	// suffix stripped, so a "0.2.0-dev" dev build still finds a "## [0.2.0]" section.
	def candidates = [modVersion, modVersion.replaceAll(/-.*/, '')].unique()
	def start = lines.findIndexOf { line -> line.startsWith('## ') && candidates.any { line.contains("[$it]") } }
	if (start < 0) return ''
	def end = lines.size()
	for (int i = start + 1; i < lines.size(); i++) {
		if (lines[i].startsWith('## ')) {
			end = i
			break
		}
	}
	return lines.subList(start + 1, end).join('\n').trim()
}

// -PmodrinthDryRun (any value, or none) verifies the config/payload without a token or a real
// upload: debugMode makes Minotaur log what it would send instead of calling the API, but it
// still requires *a* token value, so a placeholder is used when MODRINTH_TOKEN isn't set. CI
// only ever sets MODRINTH_TOKEN (and never this property), for a real, non-debug publish.
def modrinthDryRun = providers.gradleProperty('modrinthDryRun').present
def modrinthToken = System.getenv('MODRINTH_TOKEN') ?: (modrinthDryRun ? 'dry-run-placeholder-token' : null)
// -PmodrinthFile=<path>: upload that exact file instead of this build's jar output. release.yml passes its copy of the file
// it attached to the GitHub release, so both carry the same bytes by construction.
def modrinthFile = providers.gradleProperty('modrinthFile')

modrinth {
	token = modrinthToken
	projectId = 'rigtune'
	versionNumber = project.version.toString()
	versionName = "RigTune ${project.mod_version} (MC ${mcVersion})"
	// Only a plain release id (26.3, 26.3.1) publishes as a release; anything else (snapshot, pre, rc) as an alpha.
	versionType = mcVersion ==~ /\d+\.\d+(\.\d+)?/ ? 'release' : 'alpha'
	uploadFile = modrinthFile.present ? rootProject.file(modrinthFile.get()) : jar
	gameVersions = [mcVersion]
	loaders = ['fabric']
	changelog = changelogForVersion(project.mod_version.toString())
	debugMode = modrinthDryRun
	dependencies {
		required.project 'fabric-api'
	}
}

// A production client with a player's own mods, driven by the client game test in smoke mode (see ProductionSmoke):
// ./gradlew :<mc>:runProductionSmoke -PextraModsDir=<dir of mod jars> [-PuserOptions=<options.txt>] [-PuserConfigDir=<config dir>]
// The paths are relative to the repository root. The jars (built for that <mc>) are mirrored into versions/<mc>/run/mods,
// where RigTune treats them as the instance's own mods, as in a launcher instance.
configurations {
	productionSmokeMods {
		canBeConsumed = false
		transitive = false
	}
}

dependencies {
	// The fabric-api fat jar doesn't nest the client game test module.
	productionSmokeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
}

def gametestJar = tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	archiveClassifier = "gametest"
}

// v0.5 (ws-ci, SPEC 1g): which game-test classes a run gets, and their wall times. -PgametestClasses=A,B (simple names;
// build.yml passes a split part's slice from tools/gametest_matrix.py; empty or unset = every class) keeps those, in
// fabric.mod.json's order. Every class kept runs through TimedGameTests, which logs its wall time.
def gametestClasses = providers.gradleProperty("gametestClasses").map { it.split(",")*.trim().findAll { !it.isEmpty() } }.orElse([])
tasks.named("processGametestResources") {
	inputs.property("gametestClasses", gametestClasses)
	doLast {
		File file = new File(destinationDir, "fabric.mod.json")
		def mod = new groovy.json.JsonSlurper().parse(file)
		List<String> entries = mod.entrypoints["fabric-client-gametest"]
		List<String> wanted = gametestClasses.get()
		def unknown = wanted - entries.collect { it.substring(it.lastIndexOf('.') + 1) }
		if (!unknown.isEmpty()) {
			throw new GradleException("-PgametestClasses: no game-test class named " + unknown.join(", "))
		}
		mod.entrypoints["fabric-client-gametest"] = entries
				.findAll { wanted.isEmpty() || it.substring(it.lastIndexOf('.') + 1) in wanted }
				.collect { [adapter: "rigtune-timed", value: it] }
		mod.languageAdapters = ["rigtune-timed": "io.github.chaotix345.rigtune.gametest.TimedGameTests"]
		file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mod)) + "\n", "UTF-8")
	}
}

interface InjectedFs {
	@javax.inject.Inject
	FileSystemOperations getFs()
}

// Serves rules-v2.json and rules-v1.json from one folder on 127.0.0.1 (a free port) for as long as the build runs; the
// server starts when a task first asks for its URL.
interface RulesFixtureParams extends BuildServiceParameters {
	DirectoryProperty getRoot()
}

abstract class RulesFixtureServer implements BuildService<RulesFixtureParams>, AutoCloseable {
	private com.sun.net.httpserver.HttpServer server

	synchronized String baseUrl() {
		if (server == null) {
			File root = parameters.root.get().asFile
			server = com.sun.net.httpserver.HttpServer.create(new InetSocketAddress(InetAddress.getByName("127.0.0.1"), 0), 0)
			server.createContext("/", { exchange ->
				String name = exchange.requestURI.path.replaceFirst("^/", "")
				File file = new File(root, name)
				if (exchange.requestMethod == "GET" && name in ["rules-v2.json", "rules-v1.json"] && file.isFile()) {
					byte[] body = file.bytes
					exchange.responseHeaders.add("Content-Type", "application/json")
					exchange.sendResponseHeaders(200, body.length)
					exchange.responseBody.write(body)
				} else {
					exchange.sendResponseHeaders(404, -1)
				}
				exchange.close()
			} as com.sun.net.httpserver.HttpHandler)
			server.start()
		}
		return "http://127.0.0.1:" + server.address.port + "/"
	}

	@Override
	void close() {
		if (server != null) {
			server.stop(0)
		}
	}
}

// v0.5 (docs/v0.5/design/ws-ci.md): the production game tests' Modrinth, so no game test reaches api.modrinth.com. The E2E's
// FakeModrinth (tools/e2e, JDK only) runs as a single-file program, `java FakeModrinth.java`, on 127.0.0.1 with a free
// port, answering from the catalog gametestModrinthCatalog writes; it starts when a task first asks for its URL and stops
// at the end of the build. Its request log lands next to the catalog.
interface ModrinthFixtureParams extends BuildServiceParameters {
	RegularFileProperty getSource()
	DirectoryProperty getDir()
}

abstract class ModrinthFixture implements BuildService<ModrinthFixtureParams>, AutoCloseable {
	private Process process
	private String url
	private GradleException failure

	synchronized String baseUrl() {
		if (failure != null) {
			throw failure
		}
		if (process == null) {
			File dir = parameters.dir.get().asFile
			File output = new File(dir, "fake-modrinth.out")
			File requests = new File(dir, "requests.jsonl")
			output.delete()
			requests.delete()
			String java = new File(System.getProperty("java.home"), "bin/java").absolutePath
			process = new ProcessBuilder(java, parameters.source.get().asFile.absolutePath, "--catalog", new File(dir, "catalog.json").absolutePath,
					"--bind", "127.0.0.1", "--port", "0", "--log", requests.absolutePath)
					.redirectErrorStream(true).redirectOutput(output).start()
			long deadline = System.nanoTime() + 60_000_000_000L
			while (url == null) {
				def found = output.exists() ? (output.getText("UTF-8") =~ /FakeModrinth listening on (http:\/\/127\.0\.0\.1:\d+)/) : null
				if (found != null && found.find()) {
					url = found.group(1)
				} else if (!process.alive || System.nanoTime() > deadline) {
					process.destroyForcibly()
					// Kept, so a later run task in this build fails too instead of getting no URL (and so live Modrinth).
					failure = new GradleException("The game tests' fake Modrinth didn't start: " + (output.exists() ? output.getText("UTF-8") : "no output"))
					throw failure
				} else {
					Thread.sleep(100)
				}
			}
		}
		return url
	}

	// FakeModrinth serves until its standard input ends.
	@Override
	synchronized void close() {
		if (process != null) {
			process.outputStream.close()
			if (!process.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)) {
				process.destroyForcibly()
			}
		}
	}
}

def smokeRunDir = layout.projectDirectory.dir("run")
def extraModsDir = providers.gradleProperty("extraModsDir").map { rootProject.layout.projectDirectory.dir(it).asFile }
def userOptions = providers.gradleProperty("userOptions").map { rootProject.layout.projectDirectory.file(it).asFile }
def userConfigDir = providers.gradleProperty("userConfigDir").map { rootProject.layout.projectDirectory.dir(it).asFile }

def prepareProductionSmoke = tasks.register("prepareProductionSmoke") {
	def fs = objects.newInstance(InjectedFs).fs
	outputs.upToDateWhen { false }
	doLast {
		if (!extraModsDir.present) {
			throw new GradleException("Pass -PextraModsDir=<dir>: it has to provide fabric-api and the player's mods")
		}
		fs.sync {
			from(extraModsDir.get()) { include "*.jar" }
			into smokeRunDir.dir("mods")
		}
		if (userOptions.present) {
			// Exclusive fullscreen would take over the monitor, and the game test framebuffer has a fixed size anyway.
			fs.copy {
				from(userOptions.get()) { rename { "options.txt" } }
				into smokeRunDir
				filter { String line -> line.startsWith("fullscreen:") ? "fullscreen:false" : line }
			}
		}
		if (userConfigDir.present) {
			fs.copy {
				from userConfigDir.get()
				into smokeRunDir.dir("config")
			}
		}
	}
}

tasks.register("runProductionSmoke", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn prepareProductionSmoke
	runDir = smokeRunDir
	mods.from(gametestJar)
	mods.from(configurations.productionSmokeMods)
	jvmArgs.addAll("-Dfabric.client.gametest", "-Drigtune.smoke=true")
	jvmArgs.addAll(userOptions.map { ["-Drigtune.smoke.userOptions=" + it.absolutePath] }.orElse([]))
	// -PsmokeBenchmark: also run a short benchmark in the smoke world and check the DH/Iris restore (BenchmarkSmoke).
	jvmArgs.addAll(providers.gradleProperty("smokeBenchmark").map { ["-Drigtune.smoke.benchmark=true"] }.orElse([]))
	// -PsmokeDh=stage|check: AC7.3 from the title screen only, no world (DhConfigSmoke).
	jvmArgs.addAll(providers.gradleProperty("smokeDh").map { ["-Drigtune.smoke.dh=" + it] }.orElse([]))
}

// CI (build.yml, client-gametest): the client game tests against the built jar in a production client, with
// fabric-api, Sodium and ModMenu as real mod jars (the dev run has them on localRuntime). Its own run dir, wiped first.
configurations {
	productionGameTestMods {
		canBeConsumed = false
		transitive = false
	}
}

dependencies {
	productionGameTestMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionGameTestMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
	productionGameTestMods "com.terraformersmc:modmenu:${project.modmenu_version}"
	if (project.findProperty("sodium_version")) {
		productionGameTestMods "maven.modrinth:sodium:${project.sodium_version}"
	}
}

def productionGameTestRunDir = layout.buildDirectory.dir("run/productionClientGameTest")

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	def fs = objects.newInstance(InjectedFs).fs
	runDir = productionGameTestRunDir
	mods.from(gametestJar)
	mods.from(configurations.productionGameTestMods)
	jvmArgs.add("-Dfabric.client.gametest")
	doFirst {
		fs.delete { delete productionGameTestRunDir }
	}
}

// v0.4 (docs/v0.4/SPEC.md 6, AC6.6): extra JVM arguments for a LOCAL game-test run, split on whitespace, e.g.
// ./gradlew :26.2:runProductionClientGameTest -PgametestJvmArgs="-XX:+UseZGC -XX:+ZGenerational -Dusing.aikars.flags=x"
// (JvmGameTest then checks that the notes come from the running JVM). CI never passes it.
def gametestJvmArgs = providers.gradleProperty("gametestJvmArgs").map { it.trim().split(/\s+/).findAll { !it.isEmpty() } }.orElse([])
tasks.named("runProductionClientGameTest") {
	jvmArgs.addAll(gametestJvmArgs)
}
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	jvmArgumentProviders.add({ gametestJvmArgs.get() } as CommandLineArgumentProvider)
}

// Footprint guard (docs/v0.4/SPEC.md 10): FrameHookBudgetTest and FootprintGameTest read the budgets from
// tools/footprint-budgets.json. The production game tests also get the rules from this checkout's rules/ over loopback
// (-Drigtune.rules.baseUrl) instead of GitHub, so RigTune's startup work, and the guard's 5 s worker window, don't depend
// on the network (rules/rules-v2.json is the bundled copy, so the reports stay on the bundled rules).
def footprintBudgets = rootProject.file("tools/footprint-budgets.json")
tasks.named("test") {
	inputs.file(footprintBudgets).withPropertyName("footprintBudgets")
	systemProperty "rigtune.footprint.budgetsFile", footprintBudgets.absolutePath
}

def rulesFixture = gradle.sharedServices.registerIfAbsent("rigtuneRulesFixture" + project.path.replace(':', '-'), RulesFixtureServer) {
	parameters.root = rootProject.layout.projectDirectory.dir("rules")
}

tasks.named("runProductionClientGameTest") {
	usesService(rulesFixture)
	jvmArgs.add("-Drigtune.footprint.budgetsFile=" + footprintBudgets.absolutePath)
	jvmArgs.add(rulesFixture.map { "-Drigtune.rules.baseUrl=" + it.baseUrl() })
}

// The fake Modrinth's catalog for this node: the jars the production game test loads (fabric-api, Mod Menu, Sodium; their
// real bytes, so RigTune's hash lookups find them) and one version for this Minecraft version of every other mod the rules
// can recommend, each a small generated file that requires fabric-api unless tools/gametest/modrinth-candidates.json lists
// its relations. Fixed ids and dates: the same answers every run.
def modrinthFixtureDir = layout.buildDirectory.dir("gametest-modrinth")
def gametestModrinthCatalog = tasks.register("gametestModrinthCatalog") {
	def mods = configurations.productionGameTestMods
	def rulesFile = rootProject.file("rules/rules-v2.json")
	def candidatesFile = rootProject.file("tools/gametest/modrinth-candidates.json")
	def outDir = modrinthFixtureDir
	def installed = [
			"fabric-api-": [id: "P7dR8mSH", slug: "fabric-api", title: "Fabric API", version: project.fabric_api_version],
			"modmenu-"   : [id: "mOgUt4GM", slug: "modmenu", title: "Mod Menu", version: project.modmenu_version],
			"sodium-"    : [id: "AANobbMI", slug: "sodium", title: "Sodium", version: project.findProperty("sodium_version") ?: ""]]
	def mc = mcVersion
	inputs.files(mods).withPropertyName("mods")
	inputs.file(rulesFile).withPropertyName("rules")
	inputs.file(candidatesFile).withPropertyName("candidates")
	inputs.property("mc", mc)
	inputs.property("installed", installed.toString())
	outputs.dir(outDir)
	doLast {
		File dir = outDir.get().asFile
		dir.deleteDir()
		new File(dir, "files").mkdirs()
		def fixedId = { String text -> java.security.MessageDigest.getInstance("SHA-256").digest(text.getBytes("UTF-8")).encodeHex().toString().substring(0, 8) }
		def version = { String id, String number, File file, List deps ->
			[id: id, version_number: number, version_type: "release", date_published: "2026-09-01T00:00:00Z", game_versions: [mc],
			 loaders: ["fabric"], file: file.absolutePath.replace('\\', '/'), dependencies: deps]
		}
		def projects = [:]
		mods.files.sort { it.name }.each { File jar ->
			def match = installed.find { prefix, p -> jar.name.startsWith(prefix) && !jar.name.contains("gametest") }
			if (match != null) {
				def p = match.value
				projects[p.slug] = [id: p.id, slug: p.slug, title: p.title, versions: [version(fixedId("installed:" + p.slug + ":" + mc), p.version, jar, [])]]
			}
		}
		def requiresFabricApi = [[project_id: "P7dR8mSH", dependency_type: "required"]]
		def relations = new groovy.json.JsonSlurper().parse(candidatesFile, "UTF-8").dependencies
		new groovy.json.JsonSlurper().parse(rulesFile, "UTF-8").mods.each { rule ->
			if (!projects.containsKey(rule.slug)) {
				File file = new File(dir, "files/${rule.slug}-fixture+mc${mc}.jar")
				file.setText("RigTune game-test fixture: ${rule.slug} for Minecraft ${mc}\n", "UTF-8")
				projects[rule.slug] = [id: rule.projectId, slug: rule.slug, title: rule.title,
									   versions: [version(fixedId("candidate:" + rule.slug + ":" + mc), "1.0.0-fixture+mc" + mc, file, relations[rule.slug] ?: requiresFabricApi)]]
			}
		}
		new File(dir, "catalog.json").setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([cdnBase: null, projects: projects.values().toList()])), "UTF-8")
	}
}

def modrinthFixture = gradle.sharedServices.registerIfAbsent("rigtuneModrinthFixture" + project.path.replace(':', '-'), ModrinthFixture) {
	parameters.source = rootProject.layout.projectDirectory.file("tools/e2e/java/io/github/chaotix345/rigtune/e2e/FakeModrinth.java")
	parameters.dir = modrinthFixtureDir
}

// The dev game-test run too (its mods aren't these jars, so installed mods go unrecognised; the candidates are there).
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	dependsOn gametestModrinthCatalog
	usesService(modrinthFixture)
	jvmArgumentProviders.add({ ["-Drigtune.modrinth.baseUrl=" + modrinthFixture.get().baseUrl()] } as CommandLineArgumentProvider)
}

tasks.named("runProductionClientGameTest") {
	dependsOn gametestModrinthCatalog
	usesService(modrinthFixture)
	jvmArgs.add(modrinthFixture.map { "-Drigtune.modrinth.baseUrl=" + it.baseUrl() })
	finalizedBy "awaitApplyHelper"
}

// RigTune's post-exit apply helper can still be writing into the run folder after the game has exited (a pending apply is
// left only when a subset of the classes runs). It starts at exit, settles 2 s (ApplyHelper.SETTLE_MILLIS), then holds
// config/rigtune/apply.lock while it applies, and deletes pending.json once everything is applied. A finalizer, so a failed
// run waits too: the next run's wipe and the uploaded artifacts see a finished folder.
tasks.register("awaitApplyHelper") {
	def rigtuneDir = productionGameTestRunDir.map { it.dir("config/rigtune").asFile }
	doLast {
		File pending = new File(rigtuneDir.get(), "pending.json")
		File lock = new File(rigtuneDir.get(), "apply.lock")
		long start = System.nanoTime()
		while (pending.exists() && System.nanoTime() - start < 60_000_000_000L) {
			// Past the settle delay, with room for the helper's JVM start, a free lock means the helper is done (or never ran).
			if (System.nanoTime() - start > 10_000_000_000L && lock.exists()) {
				def channel = java.nio.channels.FileChannel.open(lock.toPath(), java.nio.file.StandardOpenOption.WRITE)
				try {
					def held = channel.tryLock()
					if (held != null) {
						held.release()
						break
					}
				} catch (java.nio.channels.OverlappingFileLockException ignored) {
				} finally {
					channel.close()
				}
			}
			Thread.sleep(250)
		}
		if (System.nanoTime() - start > 250_000_000L) {
			logger.lifecycle("awaitApplyHelper: waited ${(System.nanoTime() - start).intdiv(1_000_000L)} ms; pending.json ${pending.exists() ? 'still there' : 'applied'}")
		}
	}
}

// v0.5 (ws-ci): resolves every resolvable configuration of this node, so the steps after build.yml's prefetch run --offline
// (and the game tests with no network at all).
tasks.register("prefetchDependencies") {
	doLast {
		int resolved = 0
		List<String> failed = []
		configurations.findAll { it.canBeResolved }.each { c ->
			try {
				c.resolve()
				resolved++
			} catch (Exception e) {
				failed << "${c.name}: ${e.message?.readLines()?.find() ?: e.class.simpleName}".toString()
			}
		}
		logger.lifecycle("prefetchDependencies: ${project.path}: ${resolved} configurations resolved")
		// Fails the step, so tools/ci/retry.sh tries again, instead of a later --offline step failing on a missing download.
		if (!failed.isEmpty()) {
			throw new GradleException("prefetchDependencies: ${project.path}: not resolved:\n" + failed.join("\n"))
		}
	}
}

// Self-update end-to-end harness (tools/e2e/README.md), never part of the shipped jar or of `build`. The fake Modrinth
// server is a JDK-only tool run as `java FakeModrinth.java`; the unit tests compile it from tools/e2e/java.
sourceSets.test.java.srcDir(rootProject.file("tools/e2e/java"))

// The driver mod (src/e2e) compiles against the released v0.1.0 jar (-Pe2e.oldJar=<path>), not these sources, so it
// only uses API that 0.1.0 has.
def e2eOldJar = providers.gradleProperty("e2e.oldJar")
sourceSets {
	e2e {
		// Empty without the property, so an IDE sync still resolves every source set; compiling then fails below.
		compileClasspath += sourceSets.client.compileClasspath - sourceSets.main.output + files({
			e2eOldJar.present ? rootProject.file(e2eOldJar.get()) : []
		})
	}
}

tasks.named("compileE2eJava") {
	doFirst {
		if (!e2eOldJar.present) {
			throw new GradleException("Pass -Pe2e.oldJar=<path to the released rigtune-0.1.0.jar>")
		}
	}
}

def e2eDriverJar = tasks.register("e2eDriverJar", Jar) {
	from sourceSets.e2e.output
	archiveBaseName = "rigtune-e2e-driver"
	archiveVersion = ""
}

// The undo driver (src/e2eUndo, plan review M14) uses 0.2's API, so it compiles against these sources.
sourceSets {
	e2eUndo {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
	}
}

def e2eUndoDriverJar = tasks.register("e2eUndoDriverJar", Jar) {
	from sourceSets.e2eUndo.output
	archiveBaseName = "rigtune-e2e-undo-driver"
	archiveVersion = ""
}

// The downgrade driver (src/e2eDowngrade, v0.4 SPEC AC3.2) drives the released 0.3.0 jar on files 0.4 wrote, so like the
// self-update driver it compiles against the released jar (-Pe2e.oldJar), never these sources.
sourceSets {
	e2eDowngrade {
		compileClasspath += sourceSets.client.compileClasspath - sourceSets.main.output + files({
			e2eOldJar.present ? rootProject.file(e2eOldJar.get()) : []
		})
	}
}

tasks.named("compileE2eDowngradeJava") {
	doFirst {
		if (!e2eOldJar.present) {
			throw new GradleException("Pass -Pe2e.oldJar=<path to the released rigtune-0.3.0+mc26.2.jar>")
		}
	}
}

def e2eDowngradeDriverJar = tasks.register("e2eDowngradeDriverJar", Jar) {
	from sourceSets.e2eDowngrade.output
	archiveBaseName = "rigtune-e2e-downgrade-driver"
	archiveVersion = ""
}

// One launch of a production client on a scratch instance (-Pe2e.instance=<dir>), with JVM arguments from
// -Pe2e.jvmArgsFile (one per line). Unlike runProductionSmoke, `mods` is only the driver: Loom would otherwise add this
// project's jar through -Dfabric.addMods, and RigTune must load only from the instance's mods folder (plan review M10).
tasks.register("e2eClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	def instance = providers.gradleProperty("e2e.instance")
	def jvmArgsFile = providers.gradleProperty("e2e.jvmArgsFile")
	runDir = layout.dir(instance.map { new File(it) })
	// -Pe2e.driver=undo or =downgrade picks that driver; the default is the self-update driver.
	def driver = providers.gradleProperty("e2e.driver").getOrElse("")
	mods.setFrom(driver == "undo" ? e2eUndoDriverJar : driver == "downgrade" ? e2eDowngradeDriverJar : e2eDriverJar)
	jvmArgs.addAll(jvmArgsFile.map { new File(it).readLines("UTF-8").findAll { !it.isBlank() } }.orElse([]))
	programArgs.addAll("--width", "1280", "--height", "720")
	doFirst {
		if (!instance.present) {
			throw new GradleException("Pass -Pe2e.instance=<scratch instance dir>; see tools/e2e/README.md")
		}
	}
}
