org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# Dependency resolution retries a failed request up to 6 times, backing off from 1 s (Gradle's internal properties, present
# in 9.5.1's dependency-management; v0.5 ws-ci). CI resolves everything in one prefetch step and then runs --offline.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Fabric Properties (shared by every Minecraft version; per-version ones are in versions/<mc>/gradle.properties)
loader_version=0.19.5
# Pinned (v0.5 ws-ci): 1.17-SNAPSHOT's marker resolves to fabric-loom 1.17.21 (build 21, 2026-09-15); the jars are
# byte-identical, and a pinned version is never re-checked against maven.fabricmc.net.
loom_version=1.17.21

# Distant Horizons API 7.2.0 (Modrinth version id), compileOnly for the benchmark
dh_api_version=LTP8vW3B

# Mod Properties
mod_version=0.5.0-dev
maven_group=io.github.chaotix345
archives_base_name=rigtune

# Acknowledges Stonecutter's warning about Groovy build scripts
dev.kikugie.stonecutter.hard_mode=true
