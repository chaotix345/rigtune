pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
		// Stonecutter's own Maven as a fallback for its plugin marker (CI runs 36383257100 and 36410439134 failed
		// resolving dev.kikugie.stonecutter 0.9.8 from the plugin portal, "not found", after 3 tries).
		maven {
			name = 'Kikugie'
			url = 'https://maven.kikugie.dev/releases'
			content {
				includeGroup 'dev.kikugie'
				includeGroup 'dev.kikugie.stonecutter'
			}
		}
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	kotlinController = false
	centralScript = 'build.gradle'

	create(getRootProject()) {
		versions '26.2', '26.3'
		vcsVersion = '26.2'
	}
}

rootProject.name = 'rigtune'
