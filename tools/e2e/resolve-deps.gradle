// The jars the E2E harness takes from the Gradle cache (tools/e2e/self_update_e2e.py: fabric-api for every instance,
// Sodium for the profile scenarios), resolved into it before a run, so a CI job doesn't depend on another build having
// filled the cache first. Used by .github/workflows/e2e.yml:
//     ./gradlew -I tools/e2e/resolve-deps.gradle :<mc>:e2eResolveDeps
allprojects {
	tasks.register("e2eResolveDeps") {
		doLast {
			def mods = project.configurations.findByName("productionGameTestMods")
			if (mods == null) {
				throw new GradleException("no productionGameTestMods configuration in ${project.path}: update tools/e2e/resolve-deps.gradle")
			}
			mods.resolve().each { println "e2e dependency: ${it.name}" }
		}
	}
}
